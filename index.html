<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bor Nasiya - Nasiya Bor | Yuklab olish</title>
    <meta name="description" content="Bor Nasiya ilovasini hoziroq yuklab oling! Nasiyalarni boshqarish uchun eng qulay ilova.">
    
    <!-- Open Graph / Instagram Preview -->
    <meta property="og:title" content="📱 Bor Nasiya - Nasiya Bor">
    <meta property="og:description" content="Nasiyalarni oson boshqaring! Hoziroq bepul yuklab oling.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://play-lh.googleusercontent.com/proxy/app-icon">
    
    <!-- Auto redirect after 2 seconds -->
    <meta http-equiv="refresh" content="2;url=https://play.google.com/store/apps/details?id=bor.nasiya.nasiyabor">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 120px; height: 120px; top: 60%; left: 80%; animation-delay: 1s; }
        .particle:nth-child(3) { width: 60px; height: 60px; top: 80%; left: 20%; animation-delay: 2s; }
        .particle:nth-child(4) { width: 100px; height: 100px; top: 20%; left: 70%; animation-delay: 3s; }
        .particle:nth-child(5) { width: 50px; height: 50px; top: 50%; left: 50%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
            50% { transform: translateY(-30px) scale(1.1); opacity: 0.6; }
        }

        .container {
            text-align: center;
            padding: 30px 20px;
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* App Icon */
        .app-icon-wrapper {
            margin-bottom: 24px;
            position: relative;
            display: inline-block;
        }

        .app-icon {
            width: 110px;
            height: 110px;
            border-radius: 26px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
            font-size: 48px;
            animation: pulse-icon 2s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 20px 80px rgba(102, 126, 234, 0.6); }
        }

        .app-icon-glow {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            opacity: 0.2;
            filter: blur(20px);
            z-index: -1;
        }

        .app-name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* Features */
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .feature-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Download Button */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 16px 36px;
            background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 200, 83, 0.35);
            margin-bottom: 20px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 200, 83, 0.5);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .play-icon {
            width: 28px;
            height: 28px;
        }

        /* Countdown / Redirect Info */
        .redirect-info {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .countdown-number {
            display: inline-block;
            font-weight: 700;
            color: #00e676;
            font-size: 15px;
            min-width: 18px;
        }

        /* Progress bar */
        .progress-bar-wrapper {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 16px auto 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #00e676);
            border-radius: 10px;
            width: 0%;
            animation: progress 2s linear forwards;
        }

        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }

        /* Stats row */
        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .stat-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Rating stars */
        .stars {
            color: #ffd700;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Background particles -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <!-- App Icon -->
        <div class="app-icon-wrapper">
            <div class="app-icon">💰</div>
            <div class="app-icon-glow"></div>
        </div>

        <!-- App Name -->
        <h1 class="app-name">Bor Nasiya</h1>
        <p class="app-subtitle">Nasiyalarni oson va tez boshqaring</p>

        <!-- Features -->
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📊</div>
                <span class="feature-text">Hisobot</span>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <span class="feature-text">Xavfsiz</span>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <span class="feature-text">Tez</span>
            </div>
            <div class="feature">
                <div class="feature-icon">🆓</div>
                <span class="feature-text">Bepul</span>
            </div>
        </div>

        <!-- Download Button -->
        <a href="https://play.google.com/store/apps/details?id=bor.nasiya.nasiyabor" class="download-btn" id="downloadBtn">
            <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.199l2.302 2.302-2.302 2.302L15.396 12l2.302-2.302zM5.864 2.658L16.8 9.991l-2.302 2.302-8.634-8.635z"/>
            </svg>
            Yuklab olish
        </a>

        <!-- Redirect Countdown -->
        <div class="redirect-info">
            <span class="countdown-number" id="countdown">2</span> soniyada Play Market ochiladi...
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar-wrapper">
            <div class="progress-bar"></div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat">
                <div class="stat-value">⭐ 4.5+</div>
                <div class="stat-label">Reyting</div>
            </div>
            <div class="stat">
                <div class="stat-value">1K+</div>
                <div class="stat-label">Yuklanmalar</div>
            </div>
            <div class="stat">
                <div class="stat-value">🆓</div>
                <div class="stat-label">Bepul</div>
            </div>
        </div>
    </div>

    <script>
        // Countdown timer
        let seconds = 2;
        const countdownEl = document.getElementById('countdown');
        const playStoreURL = 'https://play.google.com/store/apps/details?id=bor.nasiya.nasiyabor';

        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                countdownEl.textContent = '0';
                window.location.href = playStoreURL;
            }
        }, 1000);

        // Fallback: direct click
        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            clearInterval(timer);
        });
    </script>
</body>
</html>
